[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charline-assistant"
version = "0.1.0"
description = "Deterministic helpers and versioned policy for a Hermes-native personal assistant"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
